# PF2e Hazarder — test on every push / PR, build and attach the module package on release.
#
# Releases: publish a GitHub release tagged "<major>.<minor>.<patch>" (e.g. "0.1.0", a leading "v" is fine).
# The build job stamps the tag's version and the release URLs into module.json, zips the module and
# uploads module.json + module.zip to the release. Non-prerelease releases are also pushed to
# foundryvtt.com (needs the FVTT_API_TOKEN repository secret); prereleases are not.
name: PF2e Hazarder Release Pipeline

env:
  project_url: 'https://github.com/${{ github.repository }}'
  latest_manifest_url: 'https://github.com/${{ github.repository }}/releases/latest/download/module.json'
  release_module_url: 'https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/module.zip'

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish to Foundry (for example v1.2.2)'
        required: true
        type: string
      dry_run:
        description: 'Ask Foundry to validate only, without publishing'
        required: false
        type: boolean
        default: false

jobs:
  test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        # npm install, not npm ci: the lockfile is generated on Windows and omits Linux-only optional
        # @emnapi packages, which makes npm ci refuse it. Dev dependencies only; nothing here ships.
        run: npm install --no-fund
        env:
          NPM_CONFIG_AUDIT: false

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

  build:
    runs-on: ubuntu-latest
    needs: [test]
    # The "manifest" release only holds the update link; it is never built.
    if: github.event_name != 'workflow_dispatch' && (github.event_name != 'release' || github.event.release.tag_name != 'manifest')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate module manifest
        run: jq empty module.json

      - name: Stamp release version and URLs into module.json
        if: github.event_name == 'release'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" --arg url "$project_url" --arg manifest "$latest_manifest_url" --arg download "$release_module_url" \
            '.version = $v | .url = $url | .manifest = $manifest | .download = $download' module.json > module.tmp.json
          mv module.tmp.json module.json
          cat module.json

      - name: Create module archive
        if: github.event_name == 'release'
        run: |
          zip --recurse-paths ./module.zip \
            module.json \
            scripts/ \
            templates/ \
            styles/ \
            lang/ \
            README.md \
            CHANGELOG.md \
            LICENSE

      - name: Upload manifest and archive to the release
        if: github.event_name == 'release'
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          name: ${{ github.event.release.name }}
          draft: ${{ github.event.release.unpublished }}
          prerelease: ${{ github.event.release.prerelease }}
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: './module.json, ./module.zip'
          tag: ${{ github.event.release.tag_name }}
          body: ${{ github.event.release.body }}

      # Foundry's update link is releases/latest/download/module.json, and GitHub's
      # "latest" skips prereleases. One full release, tagged "manifest", always holds
      # the newest module.json (whose download points at this version's zip), so
      # installed copies find every update, prerelease or not.
      - name: Point the update link at this version
        if: github.event_name == 'release' && github.event.release.draft != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: "Not a version: this release only carries the newest module.json so Foundry's update link (releases/latest/download/module.json) always works. Pick a real version below."
        run: |
          if gh release view manifest >/dev/null 2>&1; then
            gh release upload manifest module.json --clobber
            gh release edit manifest --latest --prerelease=false
          else
            gh release create manifest module.json --title "Update link (latest manifest)" --notes "$NOTES" --latest --target "${{ github.sha }}"
          fi
          echo "Update link now serves $(jq -r .version module.json)"

  publish-to-foundry:
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ always() && (((github.event_name == 'release' && github.event.release.prerelease != true) && needs.build.result == 'success') || github.event_name == 'workflow_dispatch') }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check The Release Exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
        run: |
          gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' | grep -qx module.json \
            || { echo "::error::Release $TAG has no module.json asset; publish it on GitHub first."; exit 1; }

      # Foundry revokes the API key when a package publishes too often: at most one release per 24 hours.
      - name: Allow One Foundry Release Per 24 Hours
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
        run: |
          since=$(date -u -d '24 hours ago' +%s)
          gh api "repos/${{ github.repository }}/actions/workflows/main.yml/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.id != ${{ github.run_id }}) | "\(.id) \(.created_at)"' |
          while read -r id created; do
            [ "$(date -u -d "$created" +%s)" -lt "$since" ] && continue
            published=$(gh api "repos/${{ github.repository }}/actions/runs/$id/jobs" \
              --jq '[.jobs[] | select(.name == "publish-to-foundry" and .conclusion == "success")] | length')
            if [ "$published" -gt 0 ]; then
              echo "::error::Foundry already received a release from run $id at $created (within 24 hours). $TAG stays on GitHub only; its update link works. Publish it later with Run workflow (Publish to Foundry)."
              exit 1
            fi
          done

      - name: Publish to Foundry VTT
        uses: JamesIves/fetch-api-data-action@v2
        with:
          endpoint: https://foundryvtt.com/_api/packages/release_version/
          configuration: '{ "method": "POST", "headers": { "Content-Type": "application/json", "Authorization": "${{ secrets.FVTT_API_TOKEN }}" }, "body": { "id": "pf2e-hazarder", "dry-run": ${{ github.event_name == ''workflow_dispatch'' && inputs.dry_run || false }}, "release": { "version": "${{ github.event_name == ''workflow_dispatch'' && inputs.tag || github.event.release.tag_name }}", "manifest": "https://github.com/${{ github.repository }}/releases/download/${{ github.event_name == ''workflow_dispatch'' && inputs.tag || github.event.release.tag_name }}/module.json", "notes": "https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md", "compatibility": { "minimum": "14", "verified": "14", "maximum": "" } } } }'
